name: Sync episodes from Transistor

# Transistor is the source of truth for episodes. This pulls the public RSS
# feed and commits any new or changed episode files, so publishing in
# Transistor is the only step needed to get an episode onto the site.
#
# Runs Tuesday mornings just after the usual publish slot, plus a second daily
# pass to catch off-schedule episodes and show-note edits.

on:
  schedule:
    # 11:10 UTC = 7:10am ET during daylight time. GitHub cron is UTC only and
    # queues under load, so this is "shortly after 7am", not exactly 7:10.
    - cron: '10 11 * * 2'
    - cron: '10 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync from the Transistor feed
        run: python3 scripts/sync-transistor.py

      - name: Commit any changes
        run: |
          if [ -z "$(git status --porcelain src/content/episodes)" ]; then
            echo "No episode changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/episodes
          git commit -m "Sync episodes from Transistor"
          git push
